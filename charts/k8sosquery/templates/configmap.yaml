# Uptycs Osquery flags file contents

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configmap.name }}
  {{- include "k8sosquery.namespace" . }}
  labels:
    {{- include "k8sosquery.appendCommonLabels" . }}
    app.kubernetes.io/name: uptycs-config
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/component: endpoint
    app.kubernetes.io/part-of: Uptycs
  {{- include "k8sosquery.commonAnnotations" . }}
{{ include "k8sosquery.configmapData" (dict "global" . "tags" .Values.configmap.data.tags "local_proxy" .Values.configmap.data.local_proxy) }}
{{- if and .Values.daemonset.nodeGroups.enabled (gt (len .Values.daemonset.nodeGroups.groups) 0) }}
{{- range .Values.daemonset.nodeGroups.groups }}
{{- $groupConfigmap := .configmap | default dict }}
{{- if gt (len $groupConfigmap) 0 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Values.configmap.name }}-{{ .name }}
  {{- include "k8sosquery.namespace" $ }}
  labels:
    {{- include "k8sosquery.appendCommonLabels" $ }}
    app.kubernetes.io/name: uptycs-config-{{ .name }}
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/component: endpoint
    app.kubernetes.io/part-of: Uptycs
  {{- include "k8sosquery.commonAnnotations" $ }}
{{ include "k8sosquery.configmapData" (dict "global" $ "tags" ($groupConfigmap.tags | default $.Values.configmap.data.tags) "local_proxy" ($groupConfigmap.local_proxy | default $.Values.configmap.data.local_proxy)) }}
{{- end }}
{{- end }}
{{- end }}
