{{- /* One ConfigMap per rendered DaemonSet (1-1). No variants => the single base ConfigMap
       (uptycs-config). Variants set => one ConfigMap per variant (uptycs-config-<name>), each
       the base config data merged with any per-variant configmap override; the base name is not
       rendered. Variant-name validation runs in daemonset.yaml and aborts the whole render. */}}
{{- $variants := .Values.variants | default (list (dict "name" "")) }}
{{- range $v := $variants }}
{{- $cmName := include "k8sosquery.configmapName" (dict "root" $ "variant" $v) }}
{{- $cmData := deepCopy $.Values.configmap.data }}
{{- if $v.configmap }}{{- $cmData = mergeOverwrite $cmData ($v.configmap.data | default dict) }}{{- end }}
{{- $cmData = include "k8sosquery.compact" $cmData | fromYaml }}
---
{{ include "k8sosquery.configmap" (dict "root" $ "name" $cmName "data" $cmData) }}
{{- end }}
