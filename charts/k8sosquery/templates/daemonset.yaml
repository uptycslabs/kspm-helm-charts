{{- $variants := .Values.daemonset.variants }}
{{- if not $variants }}
{{- $variants = list (dict "name" "") }}
{{- end }}
{{- $base := omit .Values.daemonset "variants" }}
{{- $seen := list }}
{{- range $v := .Values.daemonset.variants }}
{{-   if not $v.name }}{{ fail "daemonset.variants: every variant must set a non-empty 'name'" }}{{ end }}
{{-   if has $v.name $seen }}{{ fail (printf "daemonset.variants: duplicate variant name %q" $v.name) }}{{ end }}
{{-   $seen = append $seen $v.name }}
{{- end }}
{{- range $v := $variants }}
{{- $ds := mergeOverwrite (deepCopy $base) (omit $v "name") }}
---
{{ include "k8sosquery.daemonset" (dict "root" $ "ds" $ds "variant" ($v.name | default "")) }}
{{- end }}
