{{- define "k8sosquery.daemonset" -}}
# Create Uptycs Osquery daemonset
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.daemonset.name }}
  {{- include "k8sosquery.namespace" . }}
  labels:
    {{- include "k8sosquery.appendCommonLabels" . }}
    app.kubernetes.io/name: uptycs-osquery{{ if .IsOverride }}-override{{ end }}
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/component: endpoint
    app.kubernetes.io/part-of: Uptycs
  {{- include "k8sosquery.commonAnnotations" . }}
spec:
  {{- with .Values.daemonset.updateStrategy }}
  updateStrategy:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: uptycs-osquery{{ if .IsOverride }}-override{{ end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptycs-osquery{{ if .IsOverride }}-override{{ end }}
        app.kubernetes.io/version: 1.0.0
        app.kubernetes.io/component: endpoint
        app.kubernetes.io/part-of: Uptycs
      {{- with .Values.daemonset.podAnnotations }}
      annotations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: uptycs-osquery
      {{- if .Values.daemonset.priorityClassName }}
      priorityClassName: {{ .Values.daemonset.priorityClassName }}
      {{- end }}
      {{- with .Values.daemonset.tolerations }}
      tolerations:
      {{- toYaml . | nindent 6 }}
      {{- if $.Capabilities.APIVersions.Has "config.openshift.io/v1" }}
      - key: node-role.kubernetes.io/infra
        effect: NoSchedule
      {{- end }}
      {{- end }}
      {{- if .Values.daemonset.affinity }}
      affinity:
      {{- toYaml .Values.daemonset.affinity | nindent 8 }}
      {{- else if and (not .IsOverride) (gt (len (.Values.daemonset.override.nodeSelector | default dict)) 0) }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            {{- include "k8sosquery.excludeNodeSelectorAffinity" .Values.daemonset.override.nodeSelector | nindent 12 }}
      {{- end }}
      {{- with .Values.daemonset.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      # nodeSelector:
      #   node-role.kubernetes.io/worker: ''
      # If this daemonset should be restricted to a set of nodes, use node selector to specify the node label(s)
      # nodeSelector:
      #  app: uptycs-osquery
      hostPID: true
      hostIPC: true
      hostNetwork: true
      {{- if .Values.daemonset.dnsPolicy }}
      dnsPolicy: {{ .Values.daemonset.dnsPolicy }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
      - name: {{ .Values.daemonset.containers.name }}
        image: {{ .Values.daemonset.containers.image_name }}
        imagePullPolicy: {{ .Values.daemonset.containers.pullPolicy }}
        {{- with .Values.daemonset.containers.startupProbe }}
        startupProbe:
        {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.daemonset.containers.livenessProbe }}
        livenessProbe:
        {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.daemonset.containers.readinessProbe }}
        readinessProbe:
        {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if eq .Values.daemonset.dnsPolicy "ClusterFirstWithHostNet" }}
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "mount --bind /etc/resolv.conf /host/etc/resolv.conf"]
        {{- end }}
        {{- if eq .Values.isGKEAutopilot true }}
        securityContext:
          capabilities:
            add:
              - SYS_ADMIN
              - BPF
              - PERFMON
              - PTRACE
              - NET_ADMIN
              - NET_RAW
              - SYS_CHROOT
              - FOWNER
              - SYS_RESOURCE
        {{- else }}
        securityContext:
          privileged: true
        {{- end }}
        env:
        {{- range $k, $v := .Values.daemonset.containers.env }}
        - name: {{ $v.name }}
          value: {{ $v.value }}
        {{- end}}
        {{- with .Values.daemonset.containers.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        {{- range $k, $v := .Values.daemonset.containers.volumeMounts }}
        - name: {{ $v.name }}
        {{- if hasKey $v "mountPath" }}
          mountPath: {{ $v.mountPath }}
        {{- end }}
        {{- if hasKey $v "readOnly" }}
          readOnly: {{ $v.readOnly }}
        {{- end}}
        {{- if hasKey $v "mountPropagation" }}
          mountPropagation: {{ $v.mountPropagation }}
        {{- end }}
        {{- end }}
        {{- $isVersionGreaterOrEqual := include "k8sosquery.version" . }}
        # Beginning K8sosquery version 5.12.2.7 the nginx cert path has been updated so the below statement checks for that
        {{- if eq $isVersionGreaterOrEqual "true"}}
        - mountPath: /etc/osquery/cert
        {{- else }}
        - mountPath: /etc/osquery
        {{- end }}
          name: nginxsecret
          readOnly: true
      volumes: 
      {{- range $k, $v := .Values.daemonset.volumes }}
      - name: {{ $v.name }}
      {{- if hasKey $v "hostPath" }}
        hostPath:
          path: {{ $v.hostPath.path }}
      {{- end }}
      {{- if hasKey $v "secret" }}
        secret:
          secretName: {{ $v.secret.secretName }}
          {{- if  hasKey $v.secret "optional"}}
          optional: {{ $v.secret.optional }}
          {{- end }}
      {{- end }}
      {{- end }}
      - name: config
        configMap:
          name: {{ .Values.configmap.name }}
{{- end -}}
{{- $overrideNodeSelector := .Values.daemonset.override.nodeSelector | default dict }}
{{- $overrideResources := .Values.daemonset.override.resources | default dict }}
{{- $hasOverride := gt (len $overrideNodeSelector) 0 }}
{{- $defaultCtx := dict "Values" .Values "Release" .Release "Chart" .Chart "Capabilities" .Capabilities "Template" .Template "Files" .Files "IsOverride" false }}
{{ include "k8sosquery.daemonset" $defaultCtx }}
{{- if $hasOverride }}
{{- $overrideValues := mustDeepCopy .Values }}
{{- $mergedResources := mustMerge (mustDeepCopy $overrideResources) .Values.daemonset.containers.resources }}
{{- $_ := set $overrideValues.daemonset.containers "resources" $mergedResources }}
{{- $_ := set $overrideValues.daemonset "name" (printf "%s-override" $overrideValues.daemonset.name) }}
{{- $_ := set $overrideValues.daemonset "nodeSelector" $overrideNodeSelector }}
{{- $overrideCtx := dict "Values" $overrideValues "Release" .Release "Chart" .Chart "Capabilities" .Capabilities "Template" .Template "Files" .Files "IsOverride" true }}
---
{{ include "k8sosquery.daemonset" $overrideCtx }}
{{- end }}
