variants:
  - name: high-memory
    daemonset:
      nodeSelector:
        node-pool: high-memory
      tolerations:
        - { key: dedicated, value: high-memory, effect: NoSchedule }
      containers:
        resources:
          limits: { memory: 1Gi }
          requests: { cpu: 200m, memory: 256Mi }
    configmap:
      data:
        tags: role/high-memory
  - name: default
    daemonset:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-pool, operator: NotIn, values: [high-memory] }
