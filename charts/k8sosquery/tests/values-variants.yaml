daemonset:
  variants:
    - name: high-memory
      nodeSelector:
        node-pool: high-memory
      tolerations:
        - { key: dedicated, value: high-memory, effect: NoSchedule }
      containers:
        resources:
          limits: { memory: 1Gi }
          requests: { cpu: 200m, memory: 256Mi }
    - name: default
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-pool, operator: NotIn, values: [high-memory] }
      containers:
        resources:
          limits: { memory: 256Mi }
          requests: { cpu: 200m, memory: 100Mi }
