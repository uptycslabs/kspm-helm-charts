# Default values file for Uptycs K8sosquery.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# NOTE: Daemonset volumeMounts for K8sosquery are different for GKE & other cluster types.
# Hence this file should only be used for AKS, EKS, OpenShift & Unmanaged cluster types.
# For GKE clusters please use gke-values.yaml file.

# Uptycs cloud service onto which the cluster nodes are enrolled.
uptycsCloud: _UPTYCS_CLOUD_

# Kubernetes resources used by K8sosquery are scoped to uptycs namespace.
namespace: uptycs

# K8sosquery runs as a daemonset meaning one pod on each node of the cluster.
# Daemonset pods run in privileged mode to access the host & container telemetry.
daemonset:
  name: uptycs-osquery
  containers:
    name: uptycs-osquery
    # Image tag will decide if Uptycs protect is enabled or disabled for k8sosquery.
    image_name: uptycs/k8sosquery:_IMAGE_TAG_
    pullPolicy: IfNotPresent
    # To enable Liveness Probe for K8sosquery please follow the instructions from the following url:
    # https://{DOMAIN}{DOMAIN_SUFFIX}/help/docs/knowledge-base/configuration/liveness-probe-k8sosquey-kubequery
    startupProbe: {}
    livenessProbe: {}
    readinessProbe: {}
    env:
    - name: CHROOT_DIR
      value: /host
    - name: SOFTWARE_DIR
      value: /opt/uptycs/osquery
    # Resources specify the default values for CPU & memory settings for K8sosquery.
    # These can be changed based on the number of containers running in each node of the cluster.
    # The whole map is passed through to the container, so any resource the node
    # exposes can be set here, not just cpu and memory -- for example
    # ephemeral-storage, or an extended resource.
    resources:
      limits:
        cpu: 1000m
        memory: 500Mi
      requests:
        cpu: 200m
        memory: 100Mi
    volumeMounts:
    - name: host
      mountPath: /host
      readOnly: true
    # This is mounted read-write and should start with host mount path
    - name: osquery
      mountPath: /host/opt/uptycs/osquery
      readOnly: false
    - name: config
      mountPath: /etc/osquery/flags
    - name: secret
      mountPath: /etc/osquery/secrets
  volumes:
  - name: host
    hostPath:
      path: /
  - name: osquery
    hostPath:
      path: /opt/uptycs/osquery
  - name: secret
    secret:
      secretName: uptycs-secret
  - name: nginxsecret
    secret:
      secretName: nginx-secret
      optional: false
  # OPTIONAL: ImagePullSecrets to add to the uptycs-osquery(K8sosquery ServiceAccount) can be specified here.
  imagePullSecrets:
  # Deployment (update) strategy for the K8sosquery DaemonSet.
  # When set, the updateStrategy block is attached to the DaemonSet spec, controlling how pods
  # are replaced when the DaemonSet template changes (e.g. on an image upgrade).
  # For more info please refer to K8s docs: https://kubernetes.io/docs/tasks/manage-daemon/update-daemon-set/
  updateStrategy: {}
  # Example RollingUpdate strategy limiting how many pods are unavailable during an update:
  # updateStrategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxUnavailable: 1
  # Example OnDelete strategy where pods are only replaced when manually deleted:
  # updateStrategy:
  #   type: OnDelete
  # Optional: name of a Kubernetes PriorityClass for the K8sosquery pods.
  # When set, the PriorityClass must exist in the cluster before installing/upgrading the chart.
  priorityClassName:
  # Tolerations for K8sosquery pods can be defined here in this section.
  # Taints and tolerations work together to ensure that pods are not scheduled onto inappropriate nodes.
  # For more info please refer to K8s docs: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations:
  - key: node-role.kubernetes.io/master
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
  # Example toleration for running K8sosquery pods on arm64 architecture K8s nodes:
  # - key: kubernetes.io/arch
  #   operator: Equal
  #   value: arm64
  #   effect: NoSchedule
  # Affinity rules for K8sosquery pods can be defined here in this section.
  # When set, the affinity block is attached to the DaemonSet pod template.
  # For more info please refer to K8s docs: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}
  # Example nodeAffinity for scheduling K8sosquery pods on linux nodes:
  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #       - matchExpressions:
  #         - key: kubernetes.io/os
  #           operator: In
  #           values:
  #           - linux
  # Annotations to add to the K8sosquery pods (attached to the DaemonSet pod template).
  # Useful for things like enabling a service mesh sidecar or triggering config-reload tooling.
  podAnnotations: {}
  # Example:
  # podAnnotations:
  #   example.com/annotation-key: annotation-value
  # When enabled, the chart renders ONE DaemonSet PER ENTRY in `groups` below (from
  # templates/daemonset-nodegroups.yaml), INSTEAD OF the single default DaemonSet above, so each
  # node group can run K8sosquery with its own cpu/memory settings. Each group's nodeSelector
  # must select a mutually-exclusive, non-overlapping set of nodes -- typically a single label
  # such as node.kubernetes.io/instance-type. The chart auto-generates node anti-affinity so
  # each group's DaemonSet only schedules onto its own nodes, but this only holds if every
  # group's nodeSelector has exactly one key/value pair; groups with more than one nodeSelector
  # key will fail chart rendering.
  nodeGroups:
    enabled: false
    groups: []
    # groups:
    # - name: medium
    #   nodeSelector:
    #     node-type: medium
    #   # Partial override: any field left unset here falls back to
    #   # daemonset.containers.resources above.
    #   resources:
    #     limits:
    #       cpu: 500m
    #       memory: 500Mi
    # - name: large
    #   nodeSelector:
    #     node-type: large
    #   resources:
    #     limits:
    #       cpu: 1000m
    #       memory: 1000Mi
    # - name: xlarge
    #   nodeSelector:
    #     node-type: xlarge
    #   resources:
    #     limits:
    #       cpu: 2000m
    #       memory: 2000Mi
    # - name: 2xlarge
    #   nodeSelector:
    #     node-type: 2xlarge
    #   resources:
    #     limits:
    #       cpu: 4000m
    #       memory: 4000Mi

# Configmap contains osquery flags & tags which define K8sosquery's configuration in the cluster.
# NOTE: Please consult the Uptycs customer support before changing these configuration parameters.
configmap:
  name: uptycs-config
  data:
    # osquery tags are optional & hence empty by default but example usage is:
    # tags: key1/value1,key2/value2,key3/value3
    tags:
    # In order to use a proxy running in the same cluster by service name please specify the complete service name below like this:
    # local_proxy: <proxy_name>.<proxy_namespace>.svc.cluster.local
    local_proxy:

# Uptycs enroll secret & nginx certs are stack specific & are required to communitcate with Uptycs cloud service.
# Enroll secret contains customer identifiers & should match with allowed Uptycs infra config.
# Nginx secret contains all the root CA's accepted by Uptycs cloud.
secrets:
  createNginxSecret: true
  enroll_secret: __UPTYCS_SECRET__
  nginx_secret: |-
    __NGINX_SECRET__

# Override the release's name.
nameOverride: ""
# Override the release's fullname.
fullnameOverride: ""
# Labels to add to all created Kubernetes resources.
commonLabels: {}
# Annotations to add to all created Kubernetes resources.
commonAnnotations: {}
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
